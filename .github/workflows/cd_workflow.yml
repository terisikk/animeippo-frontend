name: Continuous Delivery

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: "Docker image build & publish"
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: "Create env file"
        # TODO: Fix the secret name
        run: |
          touch .env.production.local
          echo VITE_API_URL="${{ secrets.REACT_APP_API_URL }}" >> .env.production.local
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=registry,ref=ghcr.io/terisikk/animeippo-frontend:latest
          cache-to: type=inline
          tags: ghcr.io/terisikk/animeippo-frontend:latest
